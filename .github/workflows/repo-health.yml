name: Repository Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Validate repository health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md

      - name: Unsafe literal scan
        run: |
          ! grep -R "disable_guardrails\|can_bypass_leash" . --exclude-dir=.git --exclude-dir=.github

      - name: Shell injection safety scan
        shell: bash
        run: |
          set -euo pipefail
          # Detect unsafe direct interpolation of variables or command-substitution into
          # gh issue/pr comment/create --body / --body=. Model-generated content can contain
          # shell payloads that execute when expanded by the shell.
          python - <<'PY'
          import pathlib
          import re
          import sys
          import os
          import shlex
          command_pattern = re.compile(r"\bgh\s+(?:issue|pr)\s+(?:comment|create)\b", re.IGNORECASE)
          expansion_pattern = re.compile(r"`|\$\(|\$\{|\$[A-Za-z_][A-Za-z0-9_]*|\$[0-9]|\$[@*#?!-]")

          def logical_lines(text: str) -> list[str]:
              """Merge shell-style backslash continuations into parseable logical lines."""
              lines = text.splitlines()
              merged: list[str] = []
              buffer = ""
              for raw in lines:
                  line = raw.rstrip()
                  if buffer:
                      buffer = f"{buffer} {line.lstrip()}"
                  else:
                      buffer = line
                  if buffer.endswith("\\"):
                      buffer = buffer[:-1].rstrip()
                      continue
                  merged.append(buffer)
                  buffer = ""
              if buffer:
                  merged.append(buffer)
              return merged

          unsafe_hits: list[tuple[str, int, str]] = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d != ".git"]
              for filename in files:
                  path = pathlib.Path(root) / filename
                  if path.suffix.lower() not in {".yml", ".yaml", ".sh"}:
                      continue
                  content = path.read_text(encoding="utf-8", errors="replace")
                  for line_number, line in enumerate(logical_lines(content), start=1):
                      if not command_pattern.search(line):
                          continue
                      try:
                          tokens = shlex.split(line, posix=True)
                      except ValueError:
                          continue
                      body = None
                      for index, token in enumerate(tokens):
                          if token == "--body" and index + 1 < len(tokens):
                              body = tokens[index + 1]
                              break
                          if token.startswith("--body="):
                              body = token.split("=", 1)[1]
                              break
                      if body is None:
                          continue
                      if expansion_pattern.search(body):
                          snippet = " ".join(line.strip().split())
                          if len(snippet) > 220:
                              snippet = f"{snippet[:217]}..."
                          unsafe_hits.append((str(path), line_number, snippet[:220]))

          if unsafe_hits:
              print("ERROR: Unsafe model-output interpolation detected.")
              print("Do not pass model-generated content via --body/--body= with shell expansion.")
              print("Use --body-file (or stdin where supported) instead.")
              for file_path, line, snippet in unsafe_hits:
                  print(f"{file_path}:{line}: {snippet}")
              sys.exit(1)
          PY

      - name: Verify currently_building config is reflected in README
        shell: bash
        run: |
          set -euo pipefail
          test -f profile.config.yml
          CONFIG_ITEMS="$(awk '
            /^currently_building:[[:space:]]*$/ { in_section=1; next }
            in_section && /^[[:space:]]*-[[:space:]]+/ {
              sub(/^[[:space:]]*-[[:space:]]+/, "- ")
              print
              next
            }
            in_section && /^[^[:space:]]/ { in_section=0 }
          ' profile.config.yml)"
          README_ITEMS="$(sed -n '/<!--START_SECTION:currently_building-->/,/<!--END_SECTION:currently_building-->/p' README.md | sed '1d;$d')"
          if [ -z "$CONFIG_ITEMS" ] || [ -z "$README_ITEMS" ]; then
            echo "ERROR: Unable to extract currently_building items from profile.config.yml or README.md"
            exit 1
          fi
          if [ "$CONFIG_ITEMS" != "$README_ITEMS" ]; then
            echo "ERROR: README currently_building section is out of sync with profile.config.yml"
            echo "profile.config.yml:"
            printf '%s\n' "$CONFIG_ITEMS"
            echo "README.md:"
            printf '%s\n' "$README_ITEMS"
            exit 1
          fi
