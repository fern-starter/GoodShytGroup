name: Repository Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Validate repository health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md

      - name: Unsafe literal scan
        run: |
          ! grep -R "disable_guardrails\|can_bypass_leash" . --exclude-dir=.git --exclude-dir=.github
